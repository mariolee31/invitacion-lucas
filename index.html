<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitación Cumpleaños #10 - Lucas Mariano</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Playfair+Display:ital,wght@1,700&display=swap');
    body { font-family: 'Montserrat', sans-serif; background-color: #0d0d0f; color: #ffffff; }
    .title-font { font-family: 'Playfair Display', serif; }
    .bg-custom-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-image: url('INVITACION.jpg');
      background-size: cover; background-position: center; opacity: 0.4; z-index: -1;
    }
    .balloon {
      position: absolute; bottom: -100px; opacity: 0.7; animation: floatUp 8s infinite linear;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0.8; }
      100% { transform: translateY(-110vh) rotate(20deg); opacity: 0; }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center relative overflow-x-hidden p-4">
  <div class="bg-custom-overlay"></div>

  <!-- Globos Flotantes de Fondo -->
  <div class="balloon text-4xl left-[10%]" style="animation-delay: 0s;">🎈</div>
  <div class="balloon text-5xl left-[30%]" style="animation-delay: 2.5s;">🎈</div>
  <div class="balloon text-4xl left-[70%]" style="animation-delay: 1s;">🎈</div>
  <div class="balloon text-5xl left-[85%]" style="animation-delay: 4s;">🎈</div>

  <div class="w-full max-w-md mx-auto my-auto bg-black/75 backdrop-blur-md rounded-2xl border border-white/20 p-6 shadow-2xl text-center space-y-6">
    <div class="space-y-1">
      <p class="text-xs tracking-widest text-gray-300 uppercase">Te invitamos a celebrar el cumpleaños de</p>
      <h1 class="text-4xl font-black tracking-wider text-white">LUCAS</h1>
      <h2 class="text-3xl font-extrabold tracking-widest text-gray-200">MARIANO</h2>
    </div>

    <div class="py-2 border-y border-white/20 flex justify-center items-center gap-6">
      <div>
        <p class="text-xs text-gray-400 uppercase">Fecha</p>
        <p class="text-lg font-bold">17 Octubre</p>
      </div>
      <div class="h-8 w-px bg-white/20"></div>
      <div>
        <p class="text-xs text-gray-400 uppercase">Hora</p>
        <p class="text-lg font-bold">10:00 Hrs</p>
      </div>
    </div>

    <div>
      <p class="text-xs text-gray-400 uppercase">Lugar</p>
      <p class="text-base font-semibold">Geisha Estudio Fotográfico</p>
    </div>

    <button onclick="openModal()" class="w-full bg-white text-black font-black py-4 rounded-xl text-lg tracking-widest hover:bg-gray-200 transition shadow-lg transform active:scale-95">
      ASISTIRÉ
    </button>
  </div>

  <!-- Modal Formulario -->
  <div id="rsvpModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-zinc-900 border border-zinc-700 rounded-2xl p-6 w-full max-w-sm space-y-4 relative">
      <button onclick="closeModal()" class="absolute top-3 right-3 text-gray-400 hover:text-white"><i class="fas fa-times text-xl"></i></button>
      <h3 class="text-xl font-bold text-center">Confirmar Asistencia</h3>
      
      <form id="rsvpForm" onsubmit="submitRSVP(event)" class="space-y-4">
        <div>
          <label class="block text-xs uppercase text-gray-400 mb-1">Nombre Completo</label>
          <input type="text" id="guestName" required class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-3 text-white focus:outline-none focus:border-white">
        </div>
        <div>
          <label class="block text-xs uppercase text-gray-400 mb-1">Número de Acompañantes</label>
          <select id="guestCount" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-3 text-white focus:outline-none focus:border-white">
            <option value="0">Solo yo</option>
            <option value="1">+1 Acompañante</option>
            <option value="2">+2 Acompañantes</option>
            <option value="3">+3 Acompañantes</option>
          </select>
        </div>
        <button type="submit" id="btnSubmit" class="w-full bg-white text-black font-bold py-3 rounded-lg hover:bg-gray-200 transition">
          Enviar Confirmación
        </button>
      </form>
    </div>
  </div>

  <script>
    // PEGA AQUÍ LA URL DE TU GOOGLE APPS SCRIPT
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxgBk71kOJ8jBVjhdqZl4J_WPynCJv_X8vsxCa0OhPN2hS7g-QI0q9GGP4xXGMaDYgZ9A/exec";

    function openModal() {
      document.getElementById('rsvpModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('rsvpModal').classList.add('hidden');
    }

    function submitRSVP(event) {
      event.preventDefault();
      const btn = document.getElementById('btnSubmit');
      btn.innerText = "Enviando...";
      btn.disabled = true;

      const nombre = document.getElementById('guestName').value;
      const acompanantes = document.getElementById('guestCount').value;

      // Lanzar confeti al instante
      confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });

      fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          nombre: nombre,
          asistencia: "Confirmado",
          acompanantes: acompanantes
        })
      }).then(() => {
        alert("¡Muchas gracias por confirmar tu asistencia!");
        closeModal();
        btn.innerText = "Enviar Confirmación";
        btn.disabled = false;
        document.getElementById('rsvpForm').reset();
      }).catch(err => {
        alert("Confirmación enviada con éxito.");
        closeModal();
        btn.innerText = "Enviar Confirmación";
        btn.disabled = false;
      });
    }
  </script>
</body>
</html>
